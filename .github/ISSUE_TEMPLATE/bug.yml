name: Bug
description: 报告一个问题
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可以贴截图或报错信息
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: 出现在哪个环境
      options:
        - staging
        - production
        - 本地开发
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: 浏览器 / 设备
      placeholder: 例如 Chrome 130 / macOS
  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options:
        - P0 线上故障，需立即处理
        - P1 影响主要功能
        - P2 小问题，可排期
    validations:
      required: true
